services:
  postgres:
    image: postgres:18.6
    container_name: oibp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openitinerary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openitinerary}
      POSTGRES_DB: ${POSTGRES_DB:-openitinerary_batch_processing}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
