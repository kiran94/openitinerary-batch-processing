services:
  postgres:
    image: postgres:18.6
    container_name: oibp-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openitinerary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openitinerary}
      POSTGRES_DB: ${POSTGRES_DB:-openitinerary_batch_processing}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  adapter_api:
    image: ghcr.io/kiran94/openitinerary-adapter-api:0.1.6
    container_name: oi-adapter-api
    restart: always
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://opentelemetry_collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://opentelemetry_collector:4318/v1/metrics
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://opentelemetry_collector:4318/v1/logs
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"

  opentelemetry_collector:
    image: otel/opentelemetry-collector:0.160.0
    container_name: oibp-otel-collector
    ports:
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

  opentelemetry_prometheus:
    image: prom/prometheus:v3
    container_name: oibp-prometheus
    ports:
      - "9090:9090" # http://localhost:9090/targets
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  opentelemetry_grafana:
    image: grafana/grafana:13.0.8
    container_name: oibp-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana_datasource.yml:/etc/grafana/provisioning/datasources/grafana_datasource.yml:ro
      - ./infra/grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/openitinerary.yml:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards/openitinerary:ro
      - grafana_data:/var/lib/grafana


  opentelemetry_loki:
    image: grafana/loki:3.7.0
    container_name: oibp-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100" # http://localhost:3100/ready
    volumes:
      - ./infra/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  opentelemetry_tempo:
    image: grafana/tempo:3.0.0
    container_name: oibp-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped


volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
