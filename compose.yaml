services:
  postgres:
    image: postgres:18.6
    container_name: oibp-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openitinerary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openitinerary}
      POSTGRES_DB: ${POSTGRES_DB:-openitinerary_batch_processing}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  adapter_api:
    image: ghcr.io/kiran94/openitinerary-adapter-api:0.1.3
    container_name: oi-adapter-api
    restart: always
    ports:
      - "8000:8000"

volumes:
  postgres_data:
