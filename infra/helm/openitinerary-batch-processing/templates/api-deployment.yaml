apiVersion: apps/v1
kind: Deployment
metadata:
  name: oibp-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: oibp-api
  template:
    metadata:
      labels:
        app: oibp-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: oibp-api
          image: "{{ .Values.api.image }}:{{ .Values.api.image_tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
          envFrom:
            - configMapRef:
                name: oibp-config
            - configMapRef:
                name: oibp-config-aws
            - secretRef:
                name: {{ .Values.secrets.application.name }}
            - secretRef:
                name: {{ .Values.secrets.aws.name }}
          env:
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(K8S_POD_NAME),k8s.node.name=$(K8S_NODE_NAME)"
          volumeMounts:
            # this directory will be used for multipart uploads in the HTTP service as a potential temp buffer
            - name: ephemeral
              mountPath: "/tmp"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
              ephemeral-storage: "20Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "75Mi"
      volumes:
        - name: ephemeral
          emptyDir:
            sizeLimit: "50Mi"
