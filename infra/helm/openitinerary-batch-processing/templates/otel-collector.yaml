{{- if .Values.telemetry.enabled  -}}

apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-collector
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-http
      protocol: TCP
      port: 4318
      targetPort: otlp-http
    - name: metrics
      protocol: TCP
      port: 8888
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: collector
          image: "{{ .Values.telemetry.image }}:{{ .Values.telemetry.image_tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8888
            - name: health
              containerPort: 13133
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.otel.name | quote }}
          resources:
            requests:
              cpu: 32m
              memory: 64Mi
            limits:
              cpu: 256m
              memory: 256Mi
          volumeMounts:
            - name: config-otel
              mountPath: /etc/otelcol/config.yaml
              subPath: config.yaml # requires a restart if configmap changes: kubectl rollout restart deployment/otel-collector -n oibp
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: config-otel
          configMap:
            name: configmap-otel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-otel
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 2000
        send_batch_max_size: 3000

    exporters:
      otlp_http/grafana_cloud:
        endpoint: "${env:OTEL_EXPORTER_OTLP_ENDPOINT}"
        headers:
          Authorization: "Basic ${env:OTEL_EXPORTER_OTLP_HEADERS}"
        timeout: 10s
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 1000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 5m

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_http/grafana_cloud]

        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_http/grafana_cloud]

        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_http/grafana_cloud]

      extensions: [health_check]

      # Internal telemetry for the collector
      # to get information on telemetry passing through this collector
      # once enabled then run
      # curl http://localhost:8888/metrics | rg 'otelcol_exporter_(queue|send_failed|enqueue_failed)'
      # note that port being called here is whatever port you published on the docker side
      telemetry:
          metrics:
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: 0.0.0.0
                      port: 8888

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
        path: /health

{{ end }}
