apiVersion: v1
kind: ConfigMap
metadata:
  name: oibp-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openitinerary
data:
  OIBP_LOG_LEVEL: {{ .Values.telemetry.logLevel | quote }}
  OIBP_TELEMETRY_ENABLED: {{ .Values.telemetry.enabled | quote }}
  ADAPTER_API_URL: {{ .Values.worker.adapterApi | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector:4318"
  POSTGRES_USER: "openitinerary"
  POSTGRES_DB: "openitinerary"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oibp-config-aws
  namespace: {{ .Release.Namespace }}
data:
  AWS_REGION: {{ .Values.services.aws.region | quote }}
  SES_NOTIFICATION_CONFIGURATION_SET_NAME: {{ .Values.services.aws.ses.configurationSetName | quote }}
  SQS_QUEUE_URL: {{ .Values.services.aws.sqs.queueURL | quote }}
  OIBP_S3_USE_PATH_STYLE: {{ .Values.services.aws.s3.pathStyle | quote }}

  {{ with .Values.services.aws.endpointUrl }}
    AWS_ENDPOINT_URL: {{ . | quote }}
  {{ end }}
