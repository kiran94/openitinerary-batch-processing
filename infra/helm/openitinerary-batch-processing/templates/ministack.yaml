{{- if .Values.ministack.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: ministack
  namespace: oibp
spec:
  selector:
    app: ministack
  type: ClusterIP
  ports:
  - name: ministack-port
    protocol: TCP
    port: 4566
    targetPort: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ministack
  namespace: oibp
spec:
  replicas: 1
  # Recreate will kill all available pods before new ones are created
  # this stops multiple pods writing to the pvc at the same time
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ministack
  template:
    metadata:
      labels:
        app: ministack
    spec:
      containers:
        - name: ministack
          image: ministackorg/ministack:1.5.15
          imagePullPolicy: IfNotPresent
          ports:
            - name: gateway
              containerPort: 4566
          env:
            - name: SERVICES
              value: {{ .Values.ministack.enabledServices | quote }}
            - name: MINISTACK_HOST
              value: "ministack"
            - name: MINISTACK_REGION
              value: {{ .Values.services.aws.region | quote }}
            - name: LOG_LEVEL
              value: INFO
            - name: IOT_MTLS_ENABLED
              value: "0"
            - name: PERSIST_STATE
              value: "1"
            - name: S3_PERSIST
              value: "1"
            - name: STATE_DIR
              value: /var/lib/ministack/state
            - name: S3_DATA_DIR
              value: /var/lib/ministack/s3
          livenessProbe:
            httpGet:
              path: /_ministack/health
              port: gateway
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /_ministack/ready
              port: gateway
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: startup-script
              mountPath: /docker-entrypoint-initaws.d/ready.d
              readOnly: true
            - name: ministack-pvc
              mountPath: /var/lib/ministack
              readOnly: false
      volumes:
        - name: startup-script
          configMap:
            name: ministack-cm
            defaultMode: 0555 # readonly but executable by everyone
            items:
              - key: 01-create-resources.sh
                path: 01-create-resources.sh
        - name: ministack-pvc
          persistentVolumeClaim:
            claimName: ministack-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ministack-pvc
  namespace: oibp
spec:
  storageClassName: "standard"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ministack-cm
  namespace: oibp
data:
  01-create-resources.sh: |
    #!/bin/sh
    set -eu

    ENDPOINT_URL="http://localhost:4566"
    REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-eu-west-2}}"

    # Required if the script is executed manually. MiniStack supplies these
    # automatically when running it as a ready.d startup script.
    export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-000000000000}"
    export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-test}"
    export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-$REGION}"

    BUCKET_NAME="openitinerary-batch-processing"

    DLQ_NAME="openitinerary-batch-processing-job-queue-dlq.fifo"
    QUEUE_NAME="openitinerary-batch-processing-job-queue.fifo"

    SES_CONFIGURATION_SET="openitinerary-batch-processing-notifications"
    SES_FROM_ADDRESS="notifications@example.com"

    aws_local() {
        aws \
            --endpoint-url "$ENDPOINT_URL" \
            --region "$REGION" \
            "$@"
    }

    echo "Provisioning MiniStack resources in ${REGION}..."

    if aws_local s3api head-bucket \
        --bucket "$BUCKET_NAME" >/dev/null 2>&1
    then
        echo "S3 bucket already exists: ${BUCKET_NAME}"
    else
        echo "Creating S3 bucket: ${BUCKET_NAME}"

        aws_local s3api create-bucket \
            --bucket "$BUCKET_NAME" \
            --create-bucket-configuration "LocationConstraint=${REGION}" \
            >/dev/null
    fi

    echo "Creating or confirming FIFO dead-letter queue: ${DLQ_NAME}"

    DLQ_URL="$(
        aws_local sqs create-queue \
            --queue-name "$DLQ_NAME" \
            --attributes '{"FifoQueue":"true"}' \
            --query 'QueueUrl' \
            --output text
    )"

    DLQ_ARN="$(
        aws_local sqs get-queue-attributes \
            --queue-url "$DLQ_URL" \
            --attribute-names QueueArn \
            --query 'Attributes.QueueArn' \
            --output text
    )"

    echo "DLQ URL: ${DLQ_URL}"
    echo "DLQ ARN: ${DLQ_ARN}"

    QUEUE_ATTRIBUTES="$(
        printf \
            '{"FifoQueue":"true","VisibilityTimeout":"360","MessageRetentionPeriod":"259200","RedrivePolicy":"{\\"deadLetterTargetArn\\":\\"%s\\",\\"maxReceiveCount\\":\\"3\\"}"}' \
            "$DLQ_ARN"
    )"

    echo "Creating or confirming FIFO job queue: ${QUEUE_NAME}"

    QUEUE_URL="$(
        aws_local sqs create-queue \
            --queue-name "$QUEUE_NAME" \
            --attributes "$QUEUE_ATTRIBUTES" \
            --query 'QueueUrl' \
            --output text
    )"

    if aws_local sesv2 get-configuration-set \
        --configuration-set-name "$SES_CONFIGURATION_SET" \
        >/dev/null 2>&1
    then
        echo "SES configuration set already exists: ${SES_CONFIGURATION_SET}"
    else
        echo "Creating SES configuration set: ${SES_CONFIGURATION_SET}"

        aws_local sesv2 create-configuration-set \
            --configuration-set-name "$SES_CONFIGURATION_SET"
    fi

    if aws_local sesv2 get-email-identity \
        --email-identity "$SES_FROM_ADDRESS" \
        >/dev/null 2>&1
    then
        echo "SES email identity already exists: ${SES_FROM_ADDRESS}"
    else
        echo "Creating SES email identity: ${SES_FROM_ADDRESS}"

        aws_local sesv2 create-email-identity \
            --email-identity "$SES_FROM_ADDRESS" \
            --configuration-set-name "$SES_CONFIGURATION_SET"
    fi

    echo
    echo "MiniStack provisioning completed."
    echo "Bucket:               ${BUCKET_NAME}"
    echo "Queue URL:            ${QUEUE_URL}"
    echo "DLQ URL:              ${DLQ_URL}"
    echo "SES configuration:    ${SES_CONFIGURATION_SET}"
    echo "SES sender identity:  ${SES_FROM_ADDRESS}"
{{- end -}}
