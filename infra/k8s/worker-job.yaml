apiVersion: batch/v1
kind: CronJob
metadata:
  name: oibp-worker
  namespace: oibp
  labels:
    app: oibp-worker
spec:
  schedule: "*/10 * * * *" # every 10 mins
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  failedJobsHistoryLimit: 2
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 360
      ttlSecondsAfterFinished: 1800
      template:
        spec:
          restartPolicy: Never # on failure create a replacement pod
          containers:
            - name: oibp-worker
              image: ghcr.io/kiran94/openitinerary-batch-processing-worker:277fe99
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: oibp-config
                - secretRef:
                    name: oibp-secret
              env:
                - name: K8S_POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: K8S_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: OTEL_RESOURCE_ATTRIBUTES
                  value: "k8s.pod.name=$(K8S_POD_NAME),k8s.node.name=$(K8S_NODE_NAME)"
