apiVersion: v1
kind: ConfigMap
metadata:
  name: oibp-config
  namespace: oibp
  labels:
    app.kubernetes.io/part-of: openitinerary
data:
  OIBP_LOG_LEVEL: "INFO"
  OIBP_TELEMETRY_ENABLED: "true"
  ADAPTER_API_URL: "http://adapter-api:8000/api/v1/mock/segment-mock"
  # ADAPTER_API_URL: "http://adapter-api:8000/api/v1/adapt/segment"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector:4318"
  POSTGRES_USER: "openitinerary"
  POSTGRES_DB: "openitinerary"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oibp-config-aws
  namespace: oibp
data:
  SES_NOTIFICATION_CONFIGURATION_SET_NAME: openitinerary-batch-processing-notifications
  AWS_REGION: "eu-west-2"
  SQS_QUEUE_URL: "https://sqs.eu-west-2.amazonaws.com/851549885446/openitinerary-batch-processing-job-queue.fifo"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oibp-config-aws-ministack
  namespace: oibp
data:
  AWS_REGION: "eu-west-2"
  AWS_ENDPOINT_URL: "http://ministack:4566"
  SQS_QUEUE_URL: "http://ministack:4566/000000000000/openitinerary-batch-processing-job-queue.fifo"
  SES_NOTIFICATION_CONFIGURATION_SET_NAME: "openitinerary-batch-processing-notifications"
  OIBP_S3_USE_PATH_STYLE: "true" # avoid us applying a bunch of DNS rules in k8
