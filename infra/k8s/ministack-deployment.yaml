apiVersion: apps/v1
kind: Deployment
metadata:
  name: ministack
  namespace: oibp
spec:
  replicas: 1
  # Recreate will kill all available pods before new ones are created
  # this stops multiple pods writing to the pvc at the same time
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ministack
  template:
    metadata:
      labels:
        app: ministack
    spec:
      containers:
        - name: ministack
          image: ministackorg/ministack:1.5.15
          imagePullPolicy: IfNotPresent
          ports:
            - name: gateway
              containerPort: 4566
          env:
            - name: SERVICES
              value: "s3,sqs,ses"
            - name: MINISTACK_HOST
              value: "ministack"
            - name: MINISTACK_REGION
              value: eu-west-2
            - name: LOG_LEVEL
              value: INFO
            - name: IOT_MTLS_ENABLED
              value: "0"
            - name: PERSIST_STATE
              value: "1"
            - name: S3_PERSIST
              value: "1"
            - name: STATE_DIR
              value: /var/lib/ministack/state
            - name: S3_DATA_DIR
              value: /var/lib/ministack/s3
          livenessProbe:
            httpGet:
              path: /_ministack/health
              port: gateway
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /_ministack/ready
              port: gateway
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: startup-script
              mountPath: /docker-entrypoint-initaws.d/ready.d
              readOnly: true
            - name: ministack-pvc
              mountPath: /var/lib/ministack
              readOnly: false
      volumes:
        - name: startup-script
          configMap:
            name: ministack-cm
            defaultMode: 0555 # readonly but executable by everyone
            items:
              - key: 01-create-resources.sh
                path: 01-create-resources.sh
        - name: ministack-pvc
          persistentVolumeClaim:
            claimName: ministack-pvc
