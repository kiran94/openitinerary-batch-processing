apiVersion: apps/v1
kind: Deployment
metadata:
  name: adapter-api
  namespace: oibp
  labels:
    app.kubernetes.io/name: adapter-api
    app.kubernetes.io/part-of: openitinerary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adapter-api
  template:
    metadata:
      labels:
        app: adapter-api
    spec:
      containers:
        - name: adapter-api-http
          image: ghcr.io/kiran94/openitinerary-adapter-api:0.1.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: oibp-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: oibp-config
                  key: AWS_REGION
            - name: SES_NOTIFICATION_CONFIGURATION_SET_NAME
              valueFrom:
                configMapKeyRef:
                  name: oibp-config
                  key: SES_NOTIFICATION_CONFIGURATION_SET_NAME
            - name: SES_NOTIFICATION_ADDRESS_FROM
              valueFrom:
                secretKeyRef:
                  name: oibp-secret
                  key: SES_NOTIFICATION_ADDRESS_FROM
