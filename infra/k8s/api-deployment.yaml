apiVersion: apps/v1
kind: Deployment
metadata:
  name: oibp-api
  namespace: oibp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oibp-api
  template:
    metadata:
      labels:
        app: oibp-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: oibp-api
          image: ghcr.io/kiran94/openitinerary-batch-processing:8ffa376
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: oibp-config
            - secretRef:
                name: oibp-secret
          volumeMounts:
            # this directory will be used for multipart uploads in the HTTP service as a potential temp buffer
            - name: ephemeral
              mountPath: "/tmp"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
              ephemeral-storage: "20Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "75Mi"
      volumes:
        - name: ephemeral
          emptyDir:
            sizeLimit: "50Mi"
