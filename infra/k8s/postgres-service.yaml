apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: oibp
  labels:
    app.kubernetes.io/part-of: openitinerary
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: oibp
  labels:
    app.kubernetes.io/part-of: openitinerary
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
