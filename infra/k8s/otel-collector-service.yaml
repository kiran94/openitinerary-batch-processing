apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-collector
  namespace: oibp
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-http
      protocol: TCP
      port: 4318
      targetPort: otlp-http
    - name: metrics
      protocol: TCP
      port: 8888
      targetPort: metrics
