apiVersion: v1
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 2000
        send_batch_max_size: 3000

    exporters:
      otlp_http/grafana_cloud:
        endpoint: "${env:OTEL_EXPORTER_OTLP_ENDPOINT}"
        headers:
          Authorization: "Basic ${env:OTEL_EXPORTER_OTLP_HEADERS}"
        timeout: 10s
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 1000
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 5m

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_http/grafana_cloud]

        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_http/grafana_cloud]

        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_http/grafana_cloud]

      # Internal telemetry for the collector
      # to get information on telemetry passing through this collector
      # once enabled then run
      # curl http://localhost:8888/metrics | rg 'otelcol_exporter_(queue|send_failed|enqueue_failed)'
      # note that port being called here is whatever port you published on the docker side
      telemetry:
          metrics:
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: 0.0.0.0
                      port: 8888
kind: ConfigMap
metadata:
  name: configmap-otel
  namespace: oibp
