receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  otlphttp/loki:
    endpoint: http://opentelemetry_loki:3100/otlp
  otlphttp/tempo:
      endpoint: http://opentelemetry_tempo:4318

service:
  pipelines:

    metrics:
      receivers: [otlp]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]

    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlphttp/tempo

processors:
  batch: