apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://oibp-prometheus:9090
    isDefault: true
  - name: Loki
    type: loki
    access: proxy
    url: http://oibp-loki:3100
  - name: Tempo
    type: tempo
    access: proxy
    url: http://oibp-tempo:3200
    uid: tempo
    editable: true
