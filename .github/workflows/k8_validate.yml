name: k8 validate
on:
  push:
    branches:
      - main
    paths:
      - "infra/helm/**"
      - "infra/otel-collector-config-cloud.yaml"
      - "Makefile"
      - ".github/workflows/k8_validate.yml"
  pull_request:
    paths:
      - "infra/helm/**"
      - "infra/otel-collector-config-cloud.yaml"
      - "Makefile"
      - ".github/workflows/k8_validate.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Kubeconform
        uses: bmuschko/setup-kubeconform@v1
      - name: Lint Helm chart
        run: make helm_lint
      - name: Validate rendered manifests
        run: make k8_lint
